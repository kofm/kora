{% extends "frontpage/base.html" %}
{% block title %}Add new species{% endblock %}
{% block container %}
<h1>Add new species</h1>
<ul>
{% for specie in plantspecies_list %}
    <li>{{ specie.common_name }}</li>
{%endfor%}
</ul>
<form method="post">{% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Save">
</form>
{% endblock %}
