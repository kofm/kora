{% extends "frontpage/base.html" %}
{% load crispy_forms_tags %}


{% block title %}Create Plant Species{% endblock %}


{% block container %}

<h1 class="display-1">Create Plant Species</h1>

<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        {{ form|crispy }}
    </div>
    <p><small>*Required</small></p>
    <input class="btn btn-primary" type="submit" value="Save">
</form>
{% endblock %}
