{% extends "frontpage/base.html" %}
{% load crispy_forms_tags %}
{% load view_breadcrumbs %}

{% block title %}Create Plant Species{% endblock %}


{% block container %}

{% render_breadcrumbs %}

<h1 class="display-1">Add Plant</h1>


<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        {{ form|crispy }}
    </div>
    <p><small>*Required</small></p>
    <input class="btn btn-primary" type="submit" value="Save">
</form>

{% endblock %}
