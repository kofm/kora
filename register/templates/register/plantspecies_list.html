{% extends "frontpage/base.html" %}
{% block title %}Species{% endblock %}
{% block container %}
<h1>Species</h1>
<p><a href="{% url 'register:species_create' %}">Add new species</a></p>
<ul>
	{% for specie in object_list %}
	<li>
		<a href="{% url 'register:plantspecie_detail' specie.id %}"> {{ specie.common_name }} </a> (<i>{{ specie.latin_name }}</i>)
	</li>
	{% endfor %}
</ul>
{% endblock %}
