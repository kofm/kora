<!DOCTYPE html>
<html lang="en">
    <head>
        {% load static %}
        <script src="{% static 'frontpage/bootstrap.bundle.js' %}"></script>
        {% load django_htmx %}
        {% block javascript %}
        {% endblock %}
        <meta charset="UTF-8">
        <title>Kora - {% block title %}{% endblock %}</title>
    </head>

    <body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

        {% include 'frontpage/navbar.html' %}
        <div class="container">

            {% block container %}
            {% endblock %}

        </div>

        {% django_htmx_script %}

    </body>
</html>
