{% extends "frontpage/base.html" %}
{% block title %}
    Home
{% endblock %}

{% block container %}

    <div class="row wd-flex justify-content-center align-items-center vh-100">
        <div class="col-6">
            <figure class="text-center">
	            <blockquote class="blockquote mt-5">
		            <p>
		                “I learned this, at least, by my experiment: that if one advances
		                confidently in the direction of his dreams, and endeavors to live the life

		                hours.”
		            </p>
	            </blockquote>
	            <figcaption class="blockquote-footer">
		            David Henry Thoreau in <cite title="Source Title">Walden; or, Life in the Woods</cite>
	            </figcaption>
	        </figure>
        </div>
    </div>

    </div>

{% endblock %}
