{% extends "frontpage/modal_content.html" %}
{% load crispy_forms_tags %}

{% block title %}Change password{% endblock %}

{% block body %}
  <form id="password-update" method="post">
    {% csrf_token %}
    {{ form|crispy }}
  </form>
{% endblock %}

{% block footer %}
  <button
    class="btn btn-primary"
    type="submit"
    form="password-update"
    hx-post="{{ request.get_full_path }}"
    hx-target="#modal"
    hx-trigger="click, keyup[key=='Enter'] from:#password-update"
    hx-include="#password-update">
    Change password
  </button>
{% endblock %}
