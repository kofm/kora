{% load components %}

<div class="d-flex gap-3 justify-content-between align-items-center">
  <h2 class="my-0 {{ title_class }}">
    {{ page_title }}
  </h2>


  {% if create_url %}
    {% if create_modal %}
      <a class="btn btn-sm btn-outline-primary" hx-get="{{ create_url }}" {% modal_attrs %}>
    {% else %}
	<a class="btn btn-sm btn-outline-primary" href="{{ create_url }}">
    {% endif %}
    Create
	</a>
  {% endif %}

</div>
