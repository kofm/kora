{% load components %}
<div class="row {% if not subtitle %}mb-3{% endif %}">
  <div class="col">
    <h1 class="my-0 lh-1 {{ title_class }}">
      {{ page_title }}
    </h1>
  </div>
  <div class="col d-flex justify-content-end align-items-center">

    {% if create_url %}
      {% if create_modal %}
	<a class="btn btn-outline-primary ms-2" hx-get="{{ create_url }}" {% modal_attrs %}>
      {% else %}
	  <a class="btn btn-outline-primary ms-2" href="{{ create_url }}">
      {% endif %}
      Create
	  </a>
    {% endif %}

  </div>
</div>
{% if subtitle %}
  <div class="row mb-3">
    <div class="col">
      <p class="text-body-secondary my-0 fs-3 {% if subtitle_emphasis %}fst-italic{% endif %}">{{ subtitle }}</p>
    </div>
  </div>
{% endif %}
