<div class="col">
    <div class="card h-100">
        <div class="card-header small text-muted">
            {{ label }}
        </div>
        <div class="card-body">
            <h5 class="card-title">{{ title|default_if_none:"-" }}</h5>
            {% if time %}
                <p class="small text-muted">
                    Last updated {{ time|timesince }} ago.
                </p>
            {% endif %}
        </div>
    </div>
</div>
