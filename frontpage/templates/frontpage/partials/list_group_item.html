{# to be included in a div.list-group #}
<a href="{{ url }}" class="list-group-item list-group-item-action d-flex gap-3 py-3" aria-current="true">
    <div class="d-flex gap-2 w-100 justify-content-between">
        <div>
            <h5 class="mb-0">{{ value|default:"-" }}</h5>
            <p class="small d-block mb-0 opacity-50">{{ label }}</p>
        </div>
        <p>
            <small class="opacity-50 text-nowrap">{{ time }}</small>
        </p>
    </div>
</a>
