{# to be included in a div.list-group #}

{% load components %}

<li class="list-group-item d-flex justify-content-between align-items-center">
  <div>
    {{ value|default:"-" }}<small class="text-muted d-block">{{ time }}</small>
  </div>
  {% if update_url %}
    <button class="btn btn-sm btn-outline-secondary" hx-get="{{ update_url }}" {% modal_attrs %}>
      Update
    </button>
  {% endif %}
</li>
