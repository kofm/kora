<div id="toasts" class="toast-container position-fixed bottom-0 end-0 p-3" hx-swap-oob="after-begin">
  {% for message in messages %}
    <div class="toast align-items-center {{ message.tags }}" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header">
	{% if message.level == DEFAULT_MESSAGE_LEVELS.SUCCESS %}
	  <strong class="ms-1 me-auto"><i class="bi bi-check-circle-fill"></i></strong>
	{% elif message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}
	  <i class="bi bi-exclamation-triangle-fill"></i><strong class="ms-1 me-auto">Error</strong>
	{% elif message.level == DEFAULT_MESSAGE_LEVELS.WARNING %}
	  <i class="bi bi-question-octagon-fill"></i><strong class="ms-1 me-auto">Oops!</strong>
	{% endif %}
	<button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div class="toast-body">
	{{ message.message }}
      </div>
    </div>
  {% endfor %}
</div>
