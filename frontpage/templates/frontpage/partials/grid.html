{% block buttons %}
{% endblock %}

{% block container %}
  <div
    id="{{ container_id }}"
    class="grid-layout overflow-auto {{ container_css_class }} mb-3"
    {% if selectable %}data-selectable-grid{% endif %}
    style="grid-template-columns: repeat({{ num_columns }}, minmax(80px, 1fr));"
  >
    {% for element in elements %}
      {% include item_template_name %}
    {% endfor %}
  </div>
{% endblock %}
