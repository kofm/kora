{% block buttons %}
{% endblock %}

{% block container %}
  <div
    id="{{ container_id }}"
    class="overflow-auto {{ container_css_class }} mb-3"
    _="install Select"
    style="
	display:grid;
	grid-template-columns: repeat({{ num_columns }}, minmax(80px, 1fr));
	grid-auto-rows: 80px;
	column-gap: 1px;
	row-gap: 1px;
	"
  >
    {% for element in elements %}
      {% include item_template %}
    {% endfor %}
  </div>
{% endblock %}
