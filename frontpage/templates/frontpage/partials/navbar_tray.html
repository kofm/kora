{% load components %}

<span class="navbar-text d-flex gap-4">

  {% if user.is_authenticated %}
    {% offcanvas_toggle "workspace" "<i class='bi bi-collection'></i>" %}
    {% if perms.collect.view_cart %}
      {% offcanvas_toggle "cart" "<i class='bi bi-inbox-fill'></i>" %}
    {% endif %}
  {% endif %}

  {% include "frontpage/partials/user_menu.html" %}

  <div class="vr"></div>
  <div class="dropdown">
    <a class="text-decoration-none dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
      <i class="bi bi-brightness-high-fill"></i>

    </a>
    <ul class="dropdown-menu dropdown-menu-end" hx-swap="none">
      <li><h6 class="dropdown-header">Appearance</h6></li>
      <li class="small">
        <button type="button" class="dropdown-item{% if appearance == 'auto' %} active{% endif %}"
                data-appearance-choice="auto" aria-pressed="{% if appearance == 'auto' %}true{% else %}false{% endif %}"
                hx-post="{% url 'frontpage:appearance_set' %}" hx-vals='{"appearance": "auto"}'>
          <i class="bi bi-circle-half me-1"></i> Auto
        </button>
      </li>
      <li class="small">
        <button type="button" id="setLight" class="dropdown-item{% if appearance == 'light' %} active{% endif %}"
                data-appearance-choice="light" aria-pressed="{% if appearance == 'light' %}true{% else %}false{% endif %}"
                hx-post="{% url 'frontpage:appearance_set' %}" hx-vals='{"appearance": "light"}'>
          <i class="bi bi-brightness-high me-1"></i> Light
        </button>
      </li>
      <li class="small">
        <button type="button" id="setDark" class="dropdown-item{% if appearance == 'dark' %} active{% endif %}"
                data-appearance-choice="dark" aria-pressed="{% if appearance == 'dark' %}true{% else %}false{% endif %}"
                hx-post="{% url 'frontpage:appearance_set' %}" hx-vals='{"appearance": "dark"}'>
          <i class="bi bi-moon-stars me-1"></i> Dark
        </button>
      </li>
    </ul>
  </div>
  
</span>
