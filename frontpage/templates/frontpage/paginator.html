<nav aria-label="Table navigation">
  <ul class="pagination">

    {% if page.has_previous %}

    <li class="page-item">
      <a class="page-link" href="?{{ pagevar }}={{ page.previous_page_number }}" aria-label="Previous">
        <span aria-hidden="true">&laquo;</span>
      </a>
    </li>

    {% endif %}

    {% for p in page.paginator.page_range %}
    {% if p > page.number|add:'-5' and p < page.number|add:'5' %}
    <li class="page-item {% if forloop.counter == page.number %}active{% endif %}">
      <a class="page-link " href="?{{ pagevar }}={{ forloop.counter }}">
        {{ forloop.counter }}
      </a>
    </li>
    {% endif %}
    {% endfor %}

    {% if page.has_next %}

    <li class="page-item">
      <a class="page-link" href="?{{ pagevar }}={{ page.next_page_number }}" aria-label="Next">
        <span aria-hidden="true">&raquo;</span>
      </a>
    </li>

    {% endif %}

  </ul>
</nav>
