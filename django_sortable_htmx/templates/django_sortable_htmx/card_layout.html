{% if elements %}
    <form hx-post="{{ sort_url }}" hx-trigger="end" hx-swap="none">
        <div id="{{ container_id }}" class="row row-cols-md-3 sortable" data-sortable="{{ is_sortable|yesno:'true,false' }}">
            {% for element in elements %}
                <div class="col draggable" style="cursor: pointer;">
	            <div class="card mt-2 text-center shadow-sm {{ element.css_class }}" {% if element.url %}_="on click go to url {{ element.url }}"{% endif %}>
	                <div class="card-body d-flex flex-column">
                            <h5 class="card-title text-truncate p-1 fs-6">
                                <a class="link-body-emphasis text-decoration-none" href="{{ element.url }}">
		                    {{ element.title }}
                                </a>
                            </h5>
                            <p class="card-text mt-2"></p>
	                    <input type="hidden" name="order" value="{{ element.object.pk }}">
	                </div>
	            </div>
                </div>
            {% endfor %}
        </div>
    </form>
{% else %}
    <p class="text-muted mt-3">There are no elements to display.</p>
{% endif %}
