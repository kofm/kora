<div class="my-3">

  <button
    class="btn btn-sm btn-outline-secondary"
    _="
	   on click
	   repeat for d in <div.draggable/>
	   set elem to d then
	   get <input[name=order]/> in elem then
	   set pk to its value
	   if elem does not match <div:has(> input[name='selection'])/>
	   append `<input type=hidden name=selection value=${pk}>` to the elem then
	   add .border-primary to the elem
	   end
	   "
  >
    Select All
  </button>
  <button class="btn btn-sm btn-outline-secondary" _="on click remove <input[name=selection]/> then remove .border-primary from <div.draggable/>">Select None</button>
</div>
<form
  hx-post="{{ sort_url }}"
  hx-trigger="end"
  hx-swap="none"
>
  <div
    id="{{ element_id }}"
    class="{{ element_class }} sortable overflow-auto"
    data-sortable="{{ is_sortable|yesno:'true,false' }}"
    style="
        display:grid;
        grid-template-columns: repeat({{ cols }}, minmax(80px, 1fr));
	grid-auto-rows: 70px;
	column-gap: 1px;
	row-gap: 1px;
	"
    _="
	on click from .draggable toggle .border-primary on it then
	set elem to it then
	get <input[name=order]/> in elem then
	set pk to its value then
	if elem matches <div:has(> input[name='selection'])/>
	remove <input[name=selection]/> from elem
	otherwise
	append `<input type=hidden name=selection value=${pk}>` to the elem
	end
	"
  >
    {% for element in elements %}
      {% include item_template %}
    {% endfor %}
  </div>
</form>
