{% extends "frontpage/partials/grid.html" %}

{% block container %}
  <form
    hx-post="{{ sort_url }}"
    hx-trigger="end"
    hx-swap="none"
    >
    <div
      id="{{ container_id }}"
      class="my-3 sortable overflow-auto"
      _="install Select"
      data-sortable="{{ is_sortable|yesno:'true,false' }}"
      style="
	  display:grid;
	  grid-template-columns: repeat({{ num_columns }}, minmax(80px, 1fr));
	  grid-auto-rows: 70px;
	  column-gap: 1px;
	  row-gap: 1px;
	  "
    >
      {% for element in elements %}
	{% include item_template %}
      {% endfor %}
    </div>
  </form>
{% endblock %}
