{% extends "frontpage/base.html" %}
{% load components %}

{% block title %}Field books — {{ layout }}{% endblock %}

{% block container %}
  <h1>Field books</h1>
  <p><a href="{{ layout.get_absolute_url }}">Back to {{ layout }}</a></p>
  {% if perms.calculator.add_fieldbook %}
    <div class="d-flex justify-content-between align-items-center my-3">
      <a class="btn btn-sm btn-outline-primary" hx-get="{% url 'calculator:fieldbook_create' layout.pk %}" {% modal_attrs %}>Create</a>
    </div>
  {% endif %}
  {% render_layout cards %}
{% endblock %}
