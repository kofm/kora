<div class="row">
  {% for param in cropparameter_table %}
  <div class="card col-2 mx-1 my-1 text-center">
    <h5 data-bs-toggle="tooltip" title="{{ param.parameter__name }}" class="card-header">{{ param.parameter__code }}</h5>
    <div class="card-body">
      {{ param.value }} {{ param.parameter__measure_unit}}
    </div>
  </div>
  {% endfor %}
</div>
