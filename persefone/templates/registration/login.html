{% load static %}
{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en">
    <head>
	<meta charset="UTF-8">
	<script src="{% static 'frontpage/bootstrap.bundle.js' %}"></script>
	<title>Kora - Login</title>
    </head>
    <body>
	<div class="container">
	    <div class="d-flex justify-content-center align-items-center vh-100 text-center">
		<div class="col-3 mb-3">
		    <h1 class="mb-3">Sign in</h1>
		    <form method="post">
			{% if next %}
			    {% if user.is_authenticated %}
				<p>Your account doesn't have access to this page. To proceed, please login with an account that has access.</p>
			    {% endif %}
			{% endif %}
			{% csrf_token %}
			{{ form|crispy }}
			<button class="btn btn-lg btn-primary mt-3" type="submit">Sign in</button>
		    </form>
		</div>

	    </div>
	</div>
    </body>
