<div class="alert alert-light" role="alert">
  <h4 class="alert-heading">
    Favourited descriptions
  </h4>
  <p>
  {% if description_favourites|length > 1 %}
  <a href="{% url 'describe:description-compare' %}">Compare</a>
  {% endif %}
  <a
    href="#"
    hx-get="{% url 'describe:description-favourites-clear'  %}"
    hx-target="#favourites"
    >
    Clear
  </a>
  </p>
  <div class="row">
  {% for desc in description_favourites %}

  <!-- <a href="{% url 'describe:description_detail' desc.pk %}">{{ desc }}</a>{% if not forloop.last %}, {% endif %} -->

  <div class="col-2 border m-1 p-2 rounded-3">

    <p>
      <a class="text-decoration-none
                link-dark"
         href="{% url 'describe:description_detail' desc.pk %}">
        {{ desc.variety.name }}
      </a>
      <small class="text-muted">{{ desc.name }}</small>
    <p>


  </div>

  {% endfor %}
  </div>
</div>
