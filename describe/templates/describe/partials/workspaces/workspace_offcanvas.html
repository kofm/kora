{% load crispy_forms_tags %}

<div class="offcanvas offcanvas-end"
     tabindex="-1"
     id="workspaceOffcanvas"
     aria-labelledby="workspacesTitle"
     data-bs-scroll="true"
     data-bs-backdrop="true"
>

    <div class="offcanvas-header">
	<h5 id="workspacesTitle">Workspaces</h5>
	<button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        {% if user.is_authenticated %}
            <div id="workspaceBody"
                 hx-get="{% url 'describe:workspace_list' %}"
                 hx-trigger="load"
                 hx-swap="innerHTML">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading Workspaces...</span>
                </div>
            </div>
        {% else %}
            <p class="text-muted">
                You must be logged in to access Workspaces. <br/>
                <a href="{% url 'login' %}">Log In</a>
            </p>
        {% endif %}
    </div>
</div>
