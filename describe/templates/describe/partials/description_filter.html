<form class="mt-3" hx-post="" hx-target="#table" hx-trigger="change" hx-indicator="#spinner, #table">
    {{ formset.management_form }}

    {% for form in formset %}
        <div class="mt-2">
            {{ form.trait_id }}
            <legend>{{ form.selected_states.label }}</legend>
            {% for checkbox in form.selected_states %}
                <div class="form-check">
                    <span class="form-checkbox-input">{{ checkbox.tag }}</span>
                    <label class="form-check-label" for="{{ checkbox.id_for_label }}">
                        {{ checkbox.choice_label }}
                    </label>
                </div>
            {% endfor %}
        </div>
    {% endfor %}
</form>
