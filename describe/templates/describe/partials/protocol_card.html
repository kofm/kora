<div class="col-3 border m-3 p-3 rounded-3 draggable">
  <h5>
    <a href="{{ object.get_absolute_url }}" class="link-body-emphasis text-decoration-none">
      {{ object.name }}
    </a>
  </h5>
  <h6 class="text-muted">
    {{ object.plantspecies.common_name }}
    {% if object.url_ref %}
      <a href="{{ object.url_ref }}"><i class="bi bi-link-45deg"></i></a>
    {% endif %}
  </h6>
  <input type="hidden" name="order" value="{{ object.pk }}">
</div>
