{% extends "frontpage/tables/bootstrap5-spacious.html" %}

{% block table-wrapper %}

    {% block table %}{{ block.super }}{% endblock %}
    {% block pagination %}{{ block.super }}{% endblock %}
  </div>
{% endblock %}

{% block colgroup %}

    <col style="width: 14%;">
    <col style="width: 6rem;">
  </colgroup>
{% endblock %}
