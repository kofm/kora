{% extends "frontpage/base.html" %}

{% load static %}
{% load django_tables2 %}

{% block title %}Collect{% endblock %}

{% block container %}
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
	    <li class="breadcrumb-item"><a href="{% url "front:index" %}">Kora</a></li>
            <li class="breadcrumb-item"><a href="{% url 'collect:storage-list' %}">Storage</a></li>
            <li class="breadcrumb-item active" aria-current="page">{{ storage }}</li>
        </ol>
    </nav>

    <h1 class="display-1">
	Storage {{ storage }}
	{% if sample_count == 0 %}
	<a
	    class="text-decoration-none link-body-emphasis"
	    href="{% url 'collect:storage-delete' storage.pk %}">
	{% else %}
	<a
	    class="text-decoration-none link-body-emphasis text-muted"
	    data-bs-toggle="tooltip"
	    data-bs-title="Can't delete. Storage not empty."
	    >
	{% endif %}
	    <i class="bi bi-trash" style="font-size:2rem"></i>
	</a>
    </h1>

    {% render_table table %}

{% endblock %}
