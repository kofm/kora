{% extends "frontpage/modal_content.html" %}

{% block title %}
  Delete Cart
{% endblock %}

{% block body %}
  <p>Do you really want to <b>delete</b> the Cart?</p>
{% endblock %}

{% block footer %}
  <button type="button" class="btn btn-danger" data-bs-dismiss="modal"
    hx-post="{% url 'collect:cart_delete' cart.pk %}"
    hx-target="#cartBody">
    Delete
  </button>
  {{ block.super }}
{% endblock %}
