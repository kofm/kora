{% if user.is_authenticated %}
  <div id="cartBody"
    class="d-flex flex-column h-100"
    hx-get="{% url 'collect:cart_detail' %}"
    hx-trigger="click from:#offcanvasCartToggle once, cartUpdated from:body"
    hx-swap="innerHTML">
  </div>
{% else %}
  <p class="text-muted">
    You must be logged in to access Workspaces. <br/>
    <a href="{% url 'login' %}">Log In</a>
  </p>
{% endif %}
