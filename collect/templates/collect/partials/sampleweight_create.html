{% extends "frontpage/modal_content.html" %}
{% load crispy_forms_tags %}

{% block title %}
  Record Weight
{% endblock %}

{% block body %}
  <form id="sampleweight" onsubmit="return false;">
    {{ form|crispy }}
  </form>
{% endblock %}

{% block footer %}
  <button type="button" class="btn btn-primary" hx-post="{{ request.get_full_path }}" hx-include="#sampleweight" hx-target="#modal" hx-trigger="click, keyup[key=='Enter'] from:#sampleweight">
    Record
  </button>
  {{ block.super }}
{% endblock %}
