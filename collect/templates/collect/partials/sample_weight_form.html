{% load crispy_forms_tags %}
{% load render_table from django_tables2 %}
  <div class="card-title">
    <h2>Weight</h2>
  </div>
  <div class="card-body">
    {% render_table sample.sampleweight_set.all %}
  </div>
  <div class="mt-auto">
    <form id="weight-form" 
          hx-post="{% url 'collect:sampleweight-create' sample.pk %}"
          hx-target="#sample-weight-form">
      {% crispy sample_weight_form sample_weight_form.helper %}
    </form>
  </div>
