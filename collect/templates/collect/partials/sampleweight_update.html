{% extends "frontpage/modal_content.html" %}
{% load crispy_forms_tags %}

{% block title %}
  Update Weight
{% endblock %}

{% block body %}
  <form id="weight">
    {{ form|crispy }}
  </form>
{% endblock %}

{% block footer %}

    Update
  </button>
  {{ block.super }}
{% endblock %}
