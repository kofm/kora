{% extends "frontpage/base.html" %}
{% block title %}Create a new Seed Sample{% endblock %}
{% load static %}
{% load crispy_forms_tags %}
{% block container %}
<h1>Create a new Seed Sample</h1>

<form method="post">

  {% csrf_token %}

  <div class="form-floating mt-3">
    <select id='plantspecies_select' class="form-select" aria-label="Select crop" data-url="">
      {% for crop in plantspecies %}
      <option value="{{ crop.pk}}">{{ crop.common_name }}</option>
      {% endfor %}
    </select>
    <label class="form-label" for="plantspecies_select">Crop</label>
  </div>

  {{ form|crispy }}

  <div class="form-floating mt-3">
    <input class="btn btn-primary" type="submit">
  </div>

</form>
<script src="{% static 'frontpage/js/plantvariety_select.js' %}"></script>
{% endblock %}
