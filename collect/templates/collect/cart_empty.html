{% extends "frontpage/modal_content.html" %}

{% block title %}
  Clear Cart
{% endblock %}

{% block body %}
  <p>Do you really want to empty the cart?</p>
{% endblock %}

{% block footer %}
  <button type="button" class="btn btn-primary" data-bs-dismiss="modal"
    hx-post="{% url 'collect:cart_empty' cart.pk %}" hx-target="#cartBody">
    Clear
  </button>
  {{ block.super }}
{% endblock %}
