{% if all_params %}
<table class="table table-striped">
    <thead>
        <th>Parameter</th>
        <th>Value</th>
        <th>Reference</th>
        <th>Notes</th>
    </thead>
    {% for parameter in all_params %}
    <tr>
        <td>{{ parameter }}</td>
        <td>{{ parameter.value }}</td>
        <td>{{ parameter.url_ref }}</td>
        <td>{{ parameter.note }}</td>
    </tr>
    {% endfor %}
</table>
{% else %}
<p>There are no parameters registered.</p>
{% endif %}
