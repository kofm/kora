  /api/crops/excel_import/:
    post:
      operationId: crops_excel_import_create
      description: |-
        Import crops from a spreadsheet file.

        Supported file formats are CSV, XLS, XLSX, and ODS. The first
        row must contain the column names described below.

        Select ``Validate only`` to check the file for errors without
        importing any rows.
      tags:
      - crops
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CropImportRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CropImportRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CropImportRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExcelImportResponse'
          description: ''
  /api/crops/export-jsonl/:
