    Crop:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        variety:
          type: integer
        variety_name:
          type: string
          readOnly: true
        species:
          type: integer
          readOnly: true
        species_common_name:
          type: string
          readOnly: true
        layout:
          type: integer
        layout_name:
          type: string
          readOnly: true
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        notes:
          type: string
          description: Notes relative to the Crop
          maxLength: 500
      required:
      - created_at
      - id
      - layout
      - layout_name
      - species
      - species_common_name
      - updated_at
      - variety
      - variety_name
    CropImportRequestRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
        validate_only:
          type: boolean
          default: false
      required:
      - file
    CropLayout:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        location:
          type: integer
          description: The location to which the layout belongs
        location_name:
          type: string
          readOnly: true
        name:
          type: string
          description: A descriptive name for the layout
          maxLength: 100
        description:
          type: string
          description: Additional information about the layout
        ncol:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Columns
          description: The number of columns in which crops are arranged
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - archived_at
      - created_at
      - id
      - location
      - location_name
      - name
      - updated_at
    CropLayoutRequest:
      type: object
      properties:
        location:
          type: integer
          description: The location to which the layout belongs
        name:
          type: string
          minLength: 1
          description: A descriptive name for the layout
          maxLength: 100
        description:
          type: string
          description: Additional information about the layout
        ncol:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Columns
          description: The number of columns in which crops are arranged
      required:
      - location
      - name
    CropRequest:
      type: object
      properties:
        variety:
          type: integer
        layout:
          type: integer
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        notes:
          type: string
          description: Notes relative to the Crop
          maxLength: 500
      required:
      - layout
      - variety
    Description:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: integer
          nullable: true
        label_name:
          type: string
          readOnly: true
        variety:
          type: integer
          description: The variety to which the description refers to
        variety_name:
          type: string
          readOnly: true
        species:
          type: string
          readOnly: true
        protocol:
          type: integer
