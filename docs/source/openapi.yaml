openapi: 3.0.3
info:
  title: Kora API
  version: 0.0.0
  description: API for managing plant genetic resources data.
paths:
  /api/{cart}/cartitems/:
    get:
      operationId: cartitems_list
      parameters:
      - in: path
        name: cart
        schema:
          type: integer
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - cartitems
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCartItemList'
          description: ''
    post:
      operationId: cartitems_create
      parameters:
      - in: path
        name: cart
        schema:
          type: integer
        required: true
      tags:
      - cartitems
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartItemRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
          description: ''
  /api/{cart}/cartitems/bulk/:
    post:
      operationId: cartitems_bulk_create
      parameters:
      - in: path
        name: cart
        schema:
          type: integer
        required: true
      tags:
      - cartitems
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartItemRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
          description: ''
  /api/{cart}/cartitems/export-jsonl/:
    get:
      operationId: cartitems_export_jsonl_retrieve
      description: Export the full filtered result set as newline-delimited JSON.
      parameters:
      - in: path
        name: cart
        schema:
          type: integer
        required: true
      tags:
      - cartitems
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/x-ndjson:
              schema:
                type: string
          description: Newline-delimited JSON stream.
  /api/carts/:
    get:
      operationId: carts_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - carts
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCartList'
          description: ''
    post:
      operationId: carts_create
      tags:
      - carts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/carts/{id}/:
    get:
      operationId: carts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cart.
        required: true
      tags:
      - carts
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    put:
      operationId: carts_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cart.
        required: true
      tags:
      - carts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    patch:
      operationId: carts_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cart.
        required: true
      tags:
      - carts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCartRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCartRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCartRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: carts_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cart.
        required: true
      tags:
      - carts
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/crop-layouts/:
    get:
      operationId: crop_layouts_list
      parameters:
      - name: limit
