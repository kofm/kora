          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CropLayoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CropLayoutRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
