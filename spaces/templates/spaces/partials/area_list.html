{% for area in areas %}

<div class="card my-2">
  <div class="card-body">

    <input type="hidden" name="area_order" value="{{ area.pk }}">

    <a href="{% url 'spaces:area-detail' area.pk %}">{{ area.name }}</a>
    {{ area.length }}&times;{{ area.width }} ({{ area.total_area }})

  </div>
</div>

{% endfor %}
