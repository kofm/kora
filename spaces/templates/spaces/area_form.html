{% extends "frontpage/base.html" %}
{% load crispy_forms_tags %}
{% block title %}Area: {{ area.name }}{% endblock %}
{% block container %}
<h1>Area: {{ area.name }} ({{ area.location.name }})</h1>
<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{% url 'spaces:location-list' %}">Locations</a></li>
    <li class="breadcrumb-item active" aria-current="page">{{ area.name }}</li>
  </ol>
</nav>
<form method="post">
  {% csrf_token %}
  {{ form|crispy }}
  <button name="btn-save" type="submit" class="btn btn-outline-primary mt-3">Save</button>
</form>


{% endblock %}
