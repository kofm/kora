{% extends "frontpage/base.html" %}

{% block container %}
<h1>Delete location {{ location.name }}</h1>
<p>This operation cannot be undone. Deletion is blocked while crop layouts reference this location.</p>
<form method="post">
  {% csrf_token %}
  <button name="btn-save" type="submit" class="btn btn-outline-danger mt-3">Confirm</button>
  <a class="btn btn-outline-secondary mt-3" href="{{ object.get_absolute_url }}">Cancel</a>
</form>
{% endblock %}
