[project]
name = "kora"
version = "0.5.7"
description = "An open-source web app to manage plant genetic resources data."
readme = "README.md"
authors = [
    { name = "Gabriele Mongiano", email = "gabriele.mongiano@crea.gov.it" },
]
maintainers = [
    { name = "Gabriele Mongiano", email = "gabriele.mongiano@crea.gov.it" },
]
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12"
dependencies = [
    "crispy-bootstrap5>=0.7",
    "django==5.2",
    "django-countries>=7.6.1",
    "django-crispy-forms==1.14",
    "django-easy-audit>=1.3.7",
    "django-filter>=25.1",
    "django-forms-dynamic>=1.0.0",
    "django-render-block>=0.10",
    "django-tables2>=2.7.5",
    "django-widget-tweaks>=1.5.0",
    "djangorestframework>=3.16.0",
    "gunicorn>=23.0.0",
    "numpy>=2.2.4",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "psycopg2-binary>=2.9.10",
    "pyuca>=1.2",
    "tablib>=3.8.0",
]

[project.urls]
issues = "https://github.com/kofm/kora/issues"
homepage = "https://github.com/kofm/kora"
repository = "https://github.com/kofm/kora"

[tool.ruff]

target-version = "py311"
line-length = 120
exclude = [
    "**/migrations/*.py",
    ".venv",
    "venv",
    ".git",
    "__pypackages__",
    "dist",
    "node_modules",
    "static",
    "site-packages",
]

[tool.ruff.lint]

select = ["A", "B", "C4", "E", "F", "I", "DJ", "INP", "TID", "UP", "YTT"]
ignore = ["INP001"]
fixable = ["A", "B", "C4", "E", "F", "I", "TID", "UP"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pylsp.plugins.ruff]
enabled = true
format = ["I"]

[tool.commitizen]
name = "cz_customize"
version_files = ["pyproject.toml", "uv.lock", "docs/source/conf.py:release"]
version_provider = "pep621"
tag_format = "$version"
update_changelog_on_bump = true
annotated_tag = true
changelog_start_rev = "0.1.0"
version_scheme = "semver2"
major_version_zero = true
change_type_order = [
    "BREAKING CHANGE",
    "Added",
    "Fixed",
    "Changed",
    "Documentation"
]

[tool.commitizen.customize]
commit_parser = "^((?P<change_type>feat|fix|perf|docs|BREAKING CHANGE)(?:\\((?P<scope>[^()\r\n]*)\\)|\\()?(?P<breaking>!)?|\\w+!):\\s(?P<message>.*)?"
changelog_pattern = "^(?![\\s\\S]*\\[skip changelog\\])((BREAKING[\\- ]CHANGE|\\w+)(\\([^)]*\\))?!?):"

[tool.commitizen.change_type_map]
feat = "Added"
fix = "Fixed"
refactor = "Changed"
docs = "Documentation"

[dependency-groups]
dev = [
    "basedpyright>=1.28.5",
    "debugpy>=1.8.14",
    "django-browser-reload>=1.18.0",
    "django-debug-toolbar>=5.1.0",
    "django-extensions>=4.1",
    "django-filter-stubs>=0.1.3",
    "django-stubs>=5.2.0",
    "django-types>=0.20.0",
    "djangorestframework-stubs>=3.16.0",
    "factory-boy>=3.3.3",
    "ipython>=9.1.0",
    "pandas-stubs>=2.2.3.250527",
    "ruff>=0.11.5",
    "types-openpyxl>=3.1.5.20250516",
]
docs = [
    "sphinx>=8.2.3",
]
