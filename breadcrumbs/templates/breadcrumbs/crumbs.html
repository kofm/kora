{% if crumbs %}
  <nav class="mt-2" aria-label="breadcrumb">
    <ol class="breadcrumb kora-breadcrumb">
      <li class="breadcrumb-item">
        <a class="breadcrumb-label" href="/" title="Kora"><i class="bi bi-house-fill"></i></a>
      </li>
      {% for label, url in crumbs %}
        {% if forloop.last %}
          <li class="breadcrumb-item active" aria-current="page">
            <span class="breadcrumb-label">{{ label }}</span>
          </li>
        {% else %}
          <li class="breadcrumb-item">
            {% if url %}
              <a class="breadcrumb-label" href="{{ url }}" title="{{ label }}">{{ label }}</a>
            {% else %}
              <span class="breadcrumb-label" title="{{ label }}">{{ label }}</span>
            {% endif %}
          </li>
        {% endif %}
      {% endfor %}
    </ol>
  </nav>
{% endif %}
