{% if elements %}
    <form hx-post="{{ sort_url }}" hx-trigger="end" hx-swap="none">
        <div id="{{ container_id }}" class="row row-cols-md-3 gy-3 sortable" data-sortable="{{ is_sortable|yesno:'true,false' }}">
            {% for element in elements %}
                {% include item_template_name %}
            {% endfor %}
        </div>
    </form>
{% else %}
    <p class="text-muted mt-3">There are no elements to display.</p>
{% endif %}
