<form
  hx-post="{{ sort_url }}"
  hx-trigger="end"
  hx-swap="none"
>
  <div
    id="{{ element_id }}"
    class="{{ element_class }} sortable overflow-auto"
    data-sortable="{{ is_sortable|yesno:'true,false' }}"
    style="
        display:grid;
        grid-template-columns: repeat({{ cols }}, minmax(80px, 1fr));
	grid-auto-rows: 70px;
	column-gap: 1px;
	row-gap: 1px;
	"
  >
    {% for element in elements %}
      {% include item_template %}
    {% endfor %}
  </div>
</form>
